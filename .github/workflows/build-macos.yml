name: Build macOS (x86_64)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    # macos-13 использует архитектуру Intel x86_64
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Build Go binary (Darwin x86_64)
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: amd64
        run: |
          go mod tidy
          go build -ldflags="-s -w" -o context-builder main.go

      - name: Bundle into macOS .app
        run: |
          APP_NAME="ContextBuilder.app"
          mkdir -p "$APP_NAME/Contents/MacOS"
          mkdir -p "$APP_NAME/Contents/Resources"

          # Перемещаем скомпилированный бинарник
          mv context-builder "$APP_NAME/Contents/MacOS/context-builder"
          chmod +x "$APP_NAME/Contents/MacOS/context-builder"

          # Создаем базовый Info.plist
          cat <<EOF > "$APP_NAME/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>context-builder</string>
              <key>CFBundleIdentifier</key>
              <string>com.contextbuilder.app</string>
              <key>CFBundleName</key>
              <string>ContextBuilder</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Архивируем бандл
          zip -r ContextBuilder-macos-x86_64.zip "$APP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextBuilder-macOS-x86
          path: ContextBuilder-macos-x86_64.zip

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ContextBuilder-macos-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}